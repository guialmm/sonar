# Every morning: collect every source, re-score trust, embed new postings (up to the free
# tier's 1,000 a day).
# A failure is GitHub e-mailing the repository owner.
name: coleta

on:
  schedule:
    - cron: "17 9 * * *" # 06:17 in Brasília
  workflow_dispatch:

permissions:
  contents: read
  actions: write # re-enable this workflow at the end of every run (see the last step)

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coleta:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      # Optional: Adzuna is skipped while these secrets don't exist.
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: banco atualizado
        run: alembic upgrade head
      - name: coletar as fontes
        run: python -m app.coleta todas
      - name: nota de confiança
        run: python -m app.confianca
      - name: embeddings das vagas novas
        run: python -m app.encaixe vetores

      # GitHub disables scheduled workflows after 60 days without repository activity.
      # Re-enabling it on every run resets that clock.
      - name: manter o agendamento ativo
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/coleta.yml/enable"
